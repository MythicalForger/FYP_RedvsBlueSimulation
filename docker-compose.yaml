version: "3.8"

services:
  agent_ai:
    build: ./agent_ai
    container_name: agent_ai
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./ai_outputs:/app/outputs
    networks:
      - sandbox

  blue_agent:
    build: ./blue_agent
    container_name: blue_agent
    ports:
      - "8001:8001"                      # ✅ Blue's Flask service
    environment:
      - AGENT_AI_URL=http://agent_ai:8000/prompt   # ✅ Forward safe prompts to Agent AI
      - USE_LLM_REASONING=true                      # 🧠 Enable LLM-based reasoning
      - LLM_MODEL=gemma:2b                          # 💬 Model used via Ollama
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock   # optional if Ollama runs as a container
    networks:
      - sandbox
    depends_on:
      - agent_ai

  red_agent:
    build: ./red_agent
    container_name: red_agent
    volumes:
      - ./logs:/app/logs
    environment:
      - BLUE_URL=http://blue_agent:8001/prompt      # ✅ Red sends to Blue
    networks:
      - sandbox
    depends_on:
      - blue_agent       # ✅ must start after Blue

  monitoring_api:
    build: 
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: monitoring_api
    ports:
      - "9000:9000"
    volumes:
      - ./logs:/app/logs
    environment:
      - BLUE_URL=http://blue_agent:8001/prompt
    networks:
      - sandbox
    depends_on:
      - blue_agent

  monitoring_dashboard:
    build:
      context: ./monitoring
      dockerfile: dashboard.Dockerfile
    container_name: monitoring_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    networks:
      - sandbox
    depends_on:
      - monitoring_api

networks:
  sandbox:
    external: true
    name: agentic-sandbox

